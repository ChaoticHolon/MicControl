name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Sources/global.json
      - name: Build
        run: dotnet build Sources/MicControlNG.slnx -c Release
      - name: Test
        run: dotnet test --project Sources/MicControlNG.Tests -c Release --no-build

  # Core logic and the Avalonia UI (headless) are cross-platform; keep them building and passing on Linux.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Sources/global.json
      - name: Test
        run: dotnet test --project Sources/MicControlNG.Tests -c Release
