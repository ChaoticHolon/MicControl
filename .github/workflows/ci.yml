name: CI

on:
  push:
    branches: [master, dev, 'feature/**', 'fix/**']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Sources/MicControlNG.slnx -c Release
      - name: Test
        run: dotnet test --project Sources/MicControlNG.Tests -c Release --no-build
      # The setup is the app published as one file; keep it building and keep it as an artifact for manual testing.
      - name: Build setup
        shell: pwsh
        run: installer/build.ps1 -Version 0.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: MicControlNG-Setup
          path: artifacts/MicControlNG-Setup-*.exe
          retention-days: 14

  # Core logic and the Avalonia UI (headless) are cross-platform; keep them building and passing on Linux.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --project Sources/MicControlNG.Tests -c Release
