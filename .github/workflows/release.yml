name: Release

# Push a Semantic Versioning tag, vMAJOR.MINOR.PATCH such as v2.0.0, to publish MicControlNG-Setup-<version>.exe to GitHub Releases. The setup is the app
# itself (one self-contained file). In-app updates read the latest release and verify the setup against the SHA-256
# digest GitHub reports for it.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Release tags must be vMAJOR.MINOR.PATCH (Semantic Versioning), e.g. v2.1.0; got '$tag'"
          }
          echo "value=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
      - name: Test
        run: dotnet test --project Sources/MicControlNG.Tests -c Release
      - name: Build setup
        shell: pwsh
        run: installer/build.ps1 -Version ${{ steps.version.outputs.value }}
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.value }}'
          gh release create '${{ github.ref_name }}' "artifacts/MicControlNG-Setup-$v.exe" --title "MicControlNG $v" --generate-notes
