name: Release

# Push a Semantic Versioning tag, vMAJOR.MINOR.PATCH such as v2.1.0, on a commit in master to build a DRAFT GitHub
# release: MicControl-Setup-<version>.exe plus SHA512SUMS. Pushes to master without a tag release nothing.
# The setup is the app itself (one self-contained file). The release key never comes near CI: on their own PC the
# developer runs `tools\Signing.ps1 SignRelease v2.1.0`, which checks the draft's files, adds SHA512SUMS.sig and
# publishes it. In-app updates only offer a release whose SHA512SUMS carries that signature.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

# No telemetry from the build tools (developer's choice): the .NET SDK, Microsoft.Testing.Platform and Avalonia's
# build telemetry (also disabled for every machine in Sources/Directory.Build.targets).
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and branches, to check that the tagged commit is in master.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check tag
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Release tags must be vMAJOR.MINOR.PATCH (Semantic Versioning), e.g. v2.1.0; got '$tag'"
          }
          $version = $tag.Substring(1)

          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) { throw "$tag is not on master: releases are only made from master" }

          $props = ([xml](Get-Content Sources/Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($props -ne $version) {
            throw "$tag doesn't match <Version>$props</Version> in Sources/Directory.Build.props; bump it to $version first"
          }

          # Released files are final: re-pushing an already released tag publishes nothing, so say so before building.
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "A release for $tag already exists and its files are final; release a new version instead (or delete that release first)"
          }
          $global:LASTEXITCODE = 0

          echo "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build
        run: dotnet build Sources/MicControl.slnx -c Release
      - name: Test
        run: dotnet test --project Sources/MicControl.Tests -c Release --no-build
      - name: Build setup
        shell: pwsh
        run: installer/build.ps1 -Version ${{ steps.version.outputs.value }}
      - name: Checksums
        shell: pwsh
        run: |
          # sha512sum format, so `sha512sum -c SHA512SUMS` checks the download; the in-app updater reads it too.
          $setup = Get-Item "artifacts/MicControl-Setup-${{ steps.version.outputs.value }}.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA512).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/artifacts/SHA512SUMS", "$hash  $($setup.Name)`n")
      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.value }}'
          gh release create '${{ github.ref_name }}' "artifacts/MicControl-Setup-$v.exe" artifacts/SHA512SUMS --title "MicControl $v" --generate-notes --draft
          echo "Draft ready: sign and publish it with tools\Signing.ps1 SignRelease ${{ github.ref_name }}" >> $env:GITHUB_STEP_SUMMARY
