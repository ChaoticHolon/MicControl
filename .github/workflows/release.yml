name: Release

# Push a tag such as v2.0.0 to publish MicControlNG-Setup-<version>.exe to GitHub Releases. The setup is the app
# itself (one self-contained file). In-app updates read the latest release and verify the setup against the SHA-256
# digest GitHub reports for it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Version
        id: version
        shell: pwsh
        run: echo "value=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT
      - name: Test
        run: dotnet test --project Sources/MicControlNG.Tests -c Release
      - name: Build setup
        shell: pwsh
        run: installer/build.ps1 -Version ${{ steps.version.outputs.value }}
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.value }}'
          gh release create '${{ github.ref_name }}' "artifacts/MicControlNG-Setup-$v.exe" --title "MicControlNG $v" --generate-notes
