name: Maintenance

# Repository chores that need GitHub's own token, started by hand (Actions → Maintenance → Run workflow, ref master)
# or through the GitHub API:
# - delete-merged-branches: deletes feature/* and fix/* branches that are fully merged into dev.
# Release tags are never moved: they are signed by the developer, released history is final, and the "release tags"
# ruleset refuses updates and deletions anyway.
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        options: [delete-merged-branches]
        required: true

# Read-only by default; only the job that pushes gets write access.
permissions:
  contents: read

# No telemetry from the build tools (developer's choice), as in ci.yml and release.yml.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

concurrency: maintenance

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      # Deleting branches is a push.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and all branches: the check compares each task branch with dev.
          fetch-depth: 0

      - name: Delete merged task branches
        if: inputs.task == 'delete-merged-branches'
        run: |
          set -euo pipefail
          deleted=() kept=() failed=()
          for branch in $(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/feature/*' 'refs/remotes/origin/fix/*'); do
            if ! git merge-base --is-ancestor "origin/$branch" origin/dev; then
              kept+=("$branch")
            elif git push origin --delete "$branch"; then
              deleted+=("$branch")
            else
              failed+=("$branch")
            fi
          done
          {
            echo "### Task branches"
            echo "- Deleted (merged into dev): ${deleted[*]:-none}"
            echo "- Kept (not merged into dev): ${kept[*]:-none}"
            echo "- Couldn't delete: ${failed[*]:-none}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ ${#failed[@]} -eq 0 ]
